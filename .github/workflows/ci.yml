name: CineVibe CI & Security Audit

on:
  push:
    branches:
      - main
      - dev
      - 'ui/**'
      - 'fix/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
      - dev

jobs:
  secrets-scan:
    name: Secrets & Credential Leak Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for Excluded Credential Files in Git
        run: |
          echo "Checking if any sensitive files are tracked by Git..."
          TRACKED_SECRETS=$(git ls-files .env .env.local monitoring/mysql-exporter/.my.cnf '*.my.cnf' nginx/ssl/cinema.key '*.key' || true)
          if [ -n "$TRACKED_SECRETS" ]; then
            echo "::error::Found sensitive credential files tracked in Git repository:"
            echo "$TRACKED_SECRETS"
            exit 1
          fi
          echo "No sensitive credential files tracked by Git."

      - name: Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  node-lint:
    name: Node.js Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'app/package-lock.json'

      - name: Install App Dependencies
        run: |
          cd app
          npm ci --only=production

      - name: Validate JavaScript Syntax
        run: |
          echo "Validating syntax of core application files..."
          node --check app/server.js
          node --check app/config/database.js
          node --check app/config/logger.js
          node --check app/config/metrics.js
          node --check app/config/migration.js
          node --check app/controllers/adminController.js
          node --check app/controllers/authController.js
          node --check app/controllers/bookingController.js
          node --check app/controllers/movieController.js
          node --check app/controllers/ticketController.js
          node --check app/services/qrService.js
          node --check app/services/emailService.js
          node --check app/middlewares/auth.js
          node --check app/middlewares/metricsMiddleware.js
          echo "All JavaScript files passed syntax validation."

      - name: Validate Docker Compose Configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
          echo "Docker Compose file syntax is valid."

  integration-test:
    name: Integration Tests (Docker Compose)
    runs-on: ubuntu-latest
    needs: [node-lint]
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'app/package-lock.json'

      - name: Create .env for CI
        run: |
          cp .env.example .env
          echo "NODE_ENV=test" >> .env
          echo "SESSION_SECRET=CI_TEST_SESSION_SECRET_ONLY" >> .env
          echo "MYSQL_ROOT_PASSWORD=ci_root_pass_1234" >> .env
          echo "MYSQL_DATABASE=cinema_db" >> .env
          echo "MYSQL_USER=cinema_user" >> .env
          echo "MYSQL_PASSWORD=ci_user_pass_1234" >> .env
          echo "DB_PASSWORD=ci_user_pass_1234" >> .env
          echo "MYSQL_EXPORTER_PASSWORD=ci_exporter_1234" >> .env
          echo "DB_HOST=mysql" >> .env
          echo "DB_PORT=3306" >> .env

      - name: Start Docker Compose Services
        run: |
          docker compose up -d --build
          echo "Waiting for services to be healthy..."
          sleep 30

      - name: Wait for App Healthcheck
        run: |
          for i in {1..20}; do
            STATUS=$(curl -sf http://localhost/healthz | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['status'])" 2>/dev/null || echo "not_ready")
            echo "Attempt $i: $STATUS"
            if [ "$STATUS" = "healthy" ]; then
              echo "Application is healthy!"
              break
            fi
            sleep 5
          done

      - name: Test Database Migration Runner
        run: |
          echo "Testing standalone database migration..."
          docker compose exec -T app npm run migrate
          echo "Testing migration idempotency (running twice)..."
          docker compose exec -T app npm run migrate
          echo "Migration idempotency verified successfully."

      - name: Install Test Dependencies
        run: |
          cd app
          npm ci --only=production

      - name: Run Comprehensive Test Suite v2
        run: |
          node tests/system_comprehensive_validation.js
        timeout-minutes: 5

      - name: Collect Docker Logs on Failure
        if: failure()
        run: |
          docker compose logs app --tail=100
          docker compose logs mysql --tail=50

      - name: Shutdown Docker Services
        if: always()
        run: docker compose down -v
