# ====================================================================
# GITLEAKS CONFIGURATION (.gitleaks.toml)
# Cấu hình quét mã nguồn và kiểm soát rò rỉ thông tin xác thực
# ====================================================================

[extend]
useDefault = true

[allowlist]
description = "Ngoại lệ hẹp: Khóa riêng SSL tự ký dùng cho môi trường demo localhost trong lịch sử commit cũ (e0b26ab). Khóa này đã được untrack và đưa vào .gitignore."
paths = [
    '''(?:^|/)nginx/ssl/cinema\.key$'''
]
