apiVersion: 1

providers:
  - name: 'Cinema Monitoring Dashboards'
    orgId: 1
    folder: 'Cinema System'
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
